<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tools By DCX — My Saved Google Flow Projects</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      min-height: 100vh;
      background: #090a10;
      color: #f3f4f6;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      padding: 32px 28px;
    }
    .container {
      max-width: 1240px;
      margin: 0 auto;
    }
    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 16px;
      padding-bottom: 20px;
      margin-bottom: 26px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.09);
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .brand img {
      width: 38px;
      height: 38px;
      border-radius: 10px;
      border: 1px solid rgba(139, 92, 246, 0.4);
    }
    .brand-title {
      font-size: 20px;
      font-weight: 800;
      color: #fff;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .badge {
      font-size: 11.5px;
      font-weight: 700;
      padding: 3px 10px;
      border-radius: 999px;
      background: rgba(139, 92, 246, 0.18);
      border: 1px solid rgba(139, 92, 246, 0.45);
      color: #c4b5fd;
    }
    .brand-sub {
      font-size: 12.5px;
      color: #9ca3af;
      margin-top: 2px;
    }
    .actions {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .btn-new {
      padding: 10px 18px;
      border-radius: 10px;
      border: 0;
      background: linear-gradient(135deg, #8b5cf6 0%, #6d28d9 100%);
      color: #fff;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 7px;
      box-shadow: 0 4px 14px rgba(124, 58, 237, 0.35);
    }
    .btn-new:hover {
      filter: brightness(1.08);
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(270px, 1fr));
      gap: 18px;
    }
    .card {
      background: #12131d;
      border: 1px solid rgba(255, 255, 255, 0.09);
      border-radius: 14px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transition: transform 0.15s ease, border-color 0.15s ease, box-shadow 0.15s ease;
    }
    .card:hover {
      transform: translateY(-3px);
      border-color: rgba(139, 92, 246, 0.55);
      box-shadow: 0 12px 28px rgba(0, 0, 0, 0.5);
    }
    .thumb-wrap {
      width: 100%;
      aspect-ratio: 16 / 9;
      background: linear-gradient(135deg, #1b1730 0%, #0e0f18 100%);
      position: relative;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .thumb {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .placeholder {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      color: #a78bfa;
      font-size: 12px;
      font-weight: 600;
    }
    .del-btn {
      position: absolute;
      top: 9px;
      right: 9px;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      border: 1px solid rgba(255, 255, 255, 0.2);
      background: rgba(10, 10, 18, 0.82);
      color: #fca5a5;
      font-size: 15px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .del-btn:hover {
      background: #ef4444;
      color: #fff;
    }
    .body {
      padding: 14px 15px 15px 15px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      flex: 1;
    }
    .title {
      font-size: 14px;
      font-weight: 700;
      color: #fff;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .date {
      font-size: 11.5px;
      color: #9ca3af;
      margin-bottom: 6px;
    }
    .open-btn {
      margin-top: auto;
      width: 100%;
      padding: 10px 14px;
      border-radius: 9px;
      border: 0;
      background: linear-gradient(135deg, #8b5cf6 0%, #6d28d9 100%);
      color: #fff;
      font-size: 12.5px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
    .open-btn:hover {
      filter: brightness(1.1);
    }
    .empty {
      text-align: center;
      padding: 60px 20px;
      background: #12131d;
      border: 1px dashed rgba(255, 255, 255, 0.14);
      border-radius: 16px;
      color: #9ca3af;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="topbar">
      <div class="brand">
        <img src="logo.png" alt="Tools By DCX" />
        <div>
          <div class="brand-title">
            <span>🎬 My Saved Projects History</span>
            <span id="countBadge" class="badge">0 Saved</span>
          </div>
          <div id="userSub" class="brand-sub">Your personal Google Flow projects</div>
        </div>
      </div>
      <div class="actions">
        <button id="newFlowBtn" type="button" class="btn-new">
          <span>+ Open Google Flow</span>
        </button>
      </div>
    </div>

    <div id="projectsContainer"></div>
  </div>
  <script src="projects.js"></script>
</body>
</html>
