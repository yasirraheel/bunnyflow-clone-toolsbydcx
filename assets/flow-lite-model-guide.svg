<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">After login — select the Lite Lower Priority model</title>
  <desc id="desc">A dark Flow-style model selector showing Veo 3.1 Lite Lower Priority.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#17151f"/><stop offset="1" stop-color="#0b0a10"/></linearGradient>
    <linearGradient id="purple" x1="0" x2="1"><stop stop-color="#7c3aed"/><stop offset="1" stop-color="#a855f7"/></linearGradient>
  </defs>
  <rect width="1200" height="520" rx="20" fill="url(#bg)"/>
  <rect x="42" y="38" width="1116" height="444" rx="18" fill="#12101a" stroke="#3d334e" stroke-width="2"/>
  <text x="78" y="98" fill="#f5f2fa" font-family="Arial, sans-serif" font-size="27" font-weight="700">Flow model selector</text>
  <text x="78" y="135" fill="#a7a1b0" font-family="Arial, sans-serif" font-size="18">Choose the reliable lower-priority model before generating.</text>
  <rect x="78" y="174" width="1044" height="76" rx="12" fill="#0b0a10" stroke="#51435f" stroke-width="2"/>
  <text x="104" y="205" fill="#9b91a7" font-family="Arial, sans-serif" font-size="14">MODEL</text>
  <text x="104" y="232" fill="#fff" font-family="Arial, sans-serif" font-size="20" font-weight="700">Veo 3.1 - Lite [Lower Priority]</text>
  <path d="M1080 207l14 14 14-14" fill="none" stroke="#d7b6ff" stroke-width="3"/>
  <rect x="78" y="278" width="1044" height="112" rx="12" fill="#21182e" stroke="#7c3aed" stroke-width="2"/>
  <circle cx="116" cy="334" r="20" fill="url(#purple)"/>
  <path d="M107 334l7 7 13-15" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="156" y="328" fill="#f5f2fa" font-family="Arial, sans-serif" font-size="20" font-weight="700">Selected: Lite [Lower Priority]</text>
  <text x="156" y="357" fill="#c5bacf" font-family="Arial, sans-serif" font-size="16">Recommended for the most reliable generation.</text>
  <rect x="78" y="420" width="255" height="38" rx="19" fill="#34213f"/>
  <text x="105" y="445" fill="#d7b6ff" font-family="Arial, sans-serif" font-size="15" font-weight="700">Tools By DCX guide</text>
